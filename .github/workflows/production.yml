name: Production Release

# A push to main is a release. The version comes from app.json's expo.version, bumped by hand in a release PR on
# develop (it is also the runtime version, so OTA updates never cross it). Build numbers are kept by EAS.
# - A new version: tag it and build for the stores.
# - The same version (JavaScript-only fixes): publish an OTA update to the installed builds of that version.
#   Native changes must bump the version, since an update can't change what's in the build.
on:
  push:
    branches:
      - main

# Never cancel a release that is already tagging or queueing builds
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    name: Tag and build for the stores
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the app version
        id: version
        run: echo "tag=v$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      # One release per version: a merge to main without a version bump doesn't rebuild the same version
      - name: Tag the release
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::notice::$TAG already exists, so no new builds: publishing an OTA update instead. Bump expo.version in app.json for a new release."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" --title "$TAG" --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Queued on EAS without waiting; the iOS build goes to App Store Connect when it finishes, and you release it
      # from there. Android has no Play Store setup yet, so its build stays on EAS.
      - name: Build iOS and submit to App Store Connect
        if: steps.tag.outputs.created == 'true'
        run: eas build --profile production --platform ios --non-interactive --no-wait --auto-submit

      - name: Build Android
        if: steps.tag.outputs.created == 'true'
        run: eas build --profile production --platform android --non-interactive --no-wait

      # The version is already out: send the new JavaScript to the builds of that version instead
      - name: Publish an OTA update to production
        if: steps.tag.outputs.created == 'false'
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --branch production --message "$(printf '%s' "$MESSAGE" | head -n 1)" --non-interactive
